services:

  postgres:
    image: postgres:16
    container_name: postgres_sensores
    restart: unless-stopped

    environment:
      POSTGRES_DB: sensores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_sensores
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres
    
  api:
    build: ./api
    container_name: fastapi_sensores
    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - postgres


volumes:
  postgres_data: